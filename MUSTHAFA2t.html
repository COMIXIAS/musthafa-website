<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HII ANCHU</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        
        .container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 80%;
            max-width: 600px;
            margin: auto;
        }
        
        h1 {
            color: #4CAF50;
            font-size: 2.5rem;
        }

        p {
            font-size: 1.2rem;
            color: #555;
            margin: 20px 0;
        }

        .quote {
            font-style: italic;
            color: #4A90E2;
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 25px;
            font-size: 1.2rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #45a049;
        }

        footer {
            position: absolute;
            bottom: 10px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HII ANSHATHAHMMED</h1>
        <p>YOU ARE GOING TO BE HACKED IN 5 SECONDS!</p>
        <div class="quote" id="quote">Click the button to Start!</div>
        <button class="btn" onclick="generateQuote()">START HACKING</button>
    </div>

    <footer>
        <p>Created with 👺 by MUSTHAFA</p>
    </footer>
</body>
</html>
